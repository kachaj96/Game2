<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1d2418}canvas{display:block}</style></head><body>
<canvas id="c" width="1500" height="520"></canvas>
<script type="module">
import * as N from '../src/art/nature.js';
const cv=document.getElementById('c'),g=cv.getContext('2d');
N.ground(g,1500,520,3);N.tufts(g,1500,520,3,500);
const row=(y,fn,n,x0=70,dx=118)=>{for(let i=0;i<n;i++)fn(x0+i*dx,y,i)};
row(120,(x,y,i)=>N.oak(g,x,y,i+1,{biome:['summer','summer','lush','spring','autumn','autumn','dark','summer','lush','autumn','spring','summer'][i]}),12);
row(260,(x,y,i)=>{[N.pine,N.pine,N.birch,N.birch,N.deadTree,N.pine,N.birch][i%7](g,x,y,i+30,{snow:i===5,biome:i===3?'autumn':'summer'})},12);
row(350,(x,y,i)=>N.bush(g,x,y,i+5,{biome:['summer','lush','autumn','spring'][i%4]}),12);
row(420,(x,y,i)=>{[N.rock,N.flowers,N.mushrooms,N.stump,N.reeds,N.rock][i%6](g,x,y,i+90)},12);
N.pond(g,330,490,130,28,4);N.pond(g,900,485,180,34,9);
</script></body></html>
