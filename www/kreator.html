<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kreator postaci</title>
<style>
:root{--bg:#161014;--panel:#241a1c;--edge:#5a4030;--ink:#f0e6d0;--dim:#a89878;--ember:#e07a3a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#2a1c1a,#120d10);color:var(--ink);font:15px system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{display:grid;grid-template-columns:116px minmax(200px,1fr) minmax(330px,430px);gap:8px;height:100%;padding:8px;max-width:1280px;margin:0 auto}
#rotate{display:none;position:fixed;inset:0;z-index:9;background:#120d10;color:var(--ink);align-items:center;justify-content:center;text-align:center;font:700 20px system-ui;padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:8px;overflow:hidden;min-height:0}
h2{margin:0 0 8px;font:700 13px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#classes{display:flex;flex-direction:column;gap:6px}
.card{flex:1 1 0;min-height:0;overflow:hidden;border:2px solid var(--edge);border-radius:12px;background:#1a1214;color:var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 13px system-ui;touch-action:manipulation}
.card canvas{flex:1 1 0;min-height:0;width:100%;object-fit:contain}
.card span{white-space:nowrap;font-size:13px}
.card.on{border-color:var(--ember);background:#2c1c18;box-shadow:0 0 12px rgba(224,122,58,.35)}
#stage{position:relative;display:flex;flex-direction:column;padding:0;overflow:hidden}
#view{flex:1;min-height:0;width:100%;display:block}
#rot{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:12px}
#name{display:flex;gap:8px;padding:6px}
#name input{flex:1;min-width:0;height:42px;border-radius:10px;border:2px solid var(--edge);background:#120c0e;color:var(--ink);font:600 17px system-ui;padding:0 12px;text-align:center}
button{touch-action:manipulation;font-family:inherit}
.btn{min-width:42px;height:42px;border-radius:10px;border:2px solid var(--edge);background:#2c2022;color:var(--ink);font:700 15px system-ui;padding:0 12px}
.btn.on{border-color:var(--ember);background:#4a2a1c}
.btn.go{background:#b4501c;border-color:#e07a3a;font-size:17px;height:46px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
#opts{display:flex;flex-direction:column;gap:6px}
#tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:none}
.tab{height:40px;min-width:0;border:2px solid var(--edge);border-radius:10px;background:#1a1214;color:var(--dim);font:700 12.5px system-ui;padding:0 1px}
.tab.on{border-color:var(--ember);color:var(--ink);background:#2c1c18}
#body{flex:1 1 0;min-height:0;overflow:auto;padding-right:2px}
#foot{flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.hd h2{margin:0}
.th{width:44px;height:44px;border:2px solid var(--edge);border-radius:10px;background:#1a1214;padding:0;overflow:hidden}
.th.on{border-color:var(--ember)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--edge);padding:0}
.sw.on{border-color:#fff}
.org{width:100%;text-align:left;border:2px solid var(--edge);border-radius:10px;background:#1a1214;color:var(--ink);padding:6px 10px;margin-bottom:6px}
.org .t{display:flex;justify-content:space-between;gap:8px}.org span{display:block;color:var(--dim);font-size:12px;line-height:1.3}.org i{color:var(--ember);font-style:normal;font-size:12px;white-space:nowrap}
.org.on{border-color:var(--ember);background:#2c1c18}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:5px}.chip{height:auto;min-height:44px;text-align:left;padding:4px 8px;line-height:1.2;font-size:14px;min-width:0}.chip small{display:block;color:var(--dim);font-weight:400;font-size:11.5px}
#sum{font-size:14px;line-height:1.55;color:var(--dim)}#sum b{color:var(--ink)}
#msg{color:var(--ember);min-height:16px;font-size:13px;margin:0 0 6px}
</style></head><body><div id="app">
<div class="panel" id="classes"><h2 style="display:none">Klasa</h2></div>
<div class="panel" id="stage"><canvas id="view"></canvas><div id="rot"><button class="btn" id="left">⟲</button><button class="btn" id="walk">Chód</button><button class="btn" id="right">⟳</button></div>
<div id="name"><input id="nm" maxlength="24" aria-label="Imię"><button class="btn" id="rnd">Losuj</button></div></div>
<div class="panel" id="opts"><div id="tabs"></div><div id="body"></div><div id="foot"></div></div></div><div id="rotate">Obróć telefon do poziomu</div>
<script type="module">
import {heroSpec,CLASS_IDS,CLASS_LOOKS,SKIN_TONES,HAIR_COLORS,HAIR_STYLES,HAIR_NAMES,FACES,SWATCHES,COLOR_SLOTS,randomHeroOpts,randomName} from '../src/art/classes.js';
import {drawCharacter,DIRS} from '../src/art/characters.js';
import {CLASSES,ORIGINS,TRAITS,MAX_TRAITS,startStats} from '../src/game/classdata.js';
import {glow} from '../src/art/mood.js';
import {newCharacter} from '../src/game/progression.js';
import {saveCharacter} from '../src/game/save.js';
const $=id=>document.getElementById(id),el=(t,a={},k=[])=>{const e=document.createElement(t);Object.assign(e,a);k.forEach(c=>e.append(c));return e};
const ORDER=['SE','SW','NW','NE'];
const TABS=[['twarz','Twarz'],['barwy','Barwy'],['stroj','Strój'],['org','Historia'],['cechy','Cechy'],['gotowe','Gotowe']];
const stats=()=>startStats(st.classId,ORIGINS[st.origin].id,st.traits);
const st={classId:'grabarz',female:false,face:1,hairStyle:'short',hair:HAIR_COLORS[2],skin:SKIN_TONES[1],colors:[...CLASS_LOOKS.grabarz.colors],slot:0,name:randomName(1),origin:0,traits:[],tab:'twarz',dir:0,walk:false,nameSeed:1,heroSeed:1};
const spec=(over={})=>heroSpec(st.classId,{...st,seed:st.heroSeed,...over});
const dirOpt=()=>DIRS[ORDER[st.dir]];

function thumb(cv,sp,K0=2.5){const K=K0*cv.width/58;const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);g.fillStyle='#241a1c';g.fillRect(0,0,cv.width,cv.height);
  drawCharacter(g,cv.width/2,cv.height/2+35*sp.sc*K+2*cv.width/58,{...sp,sc:sp.sc*K,hat:null},{...DIRS.SE})}
function portrait(cv,id){const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);const sp=heroSpec(id,{face:1,colors:CLASS_LOOKS[id].colors});drawCharacter(g,cv.width/2,cv.height-6,{...sp,sc:sp.sc*0.93},{...DIRS.SE})}
function build(){
  const cl=$('classes');cl.querySelectorAll('.card').forEach(n=>n.remove());
  for(const id of CLASS_IDS){const c=CLASSES[id],cv=el('canvas',{width:70,height:86});const b=el('button',{className:'card'+(st.classId===id?' on':''),id:'cls-'+id},[cv,el('span',{textContent:c.name})]);
    b.onclick=()=>{st.classId=id;st.colors=[...CLASS_LOOKS[id].colors];render()};cl.append(b);portrait(cv,id)}
  const tb=$('tabs');tb.innerHTML='';
  for(const [id,t] of TABS){const b=el('button',{className:'tab'+(st.tab===id?' on':''),textContent:t,id:'tab-'+id});b.onclick=()=>{st.tab=id;st.saved=undefined;render()};tb.append(b)}
  const o=$('body'),keep=st._tab===st.tab?o.scrollTop:0;st._tab=st.tab;o.innerHTML='';
  const sec=(t,k)=>{o.append(el('h2',{textContent:t}));const r=el('div',{className:'row'},k);o.append(r);return r};
  const thumbBtn=(id,on,fn,over,title)=>{const cv=el('canvas',{width:88,height:88});cv.style.cssText='width:100%;height:100%;display:block';const b=el('button',{className:'th'+(on?' on':''),id,title},[cv]);b.onclick=fn;thumb(cv,spec(over));return b};
  if(st.tab==='twarz'){
    const hd=el('div',{className:'hd'},[el('h2',{textContent:'Płeć'})]);
    const gb=el('div',{className:'row'});gb.style.margin='0';[['♂',false],['♀',true]].forEach(([t,v])=>{const b=el('button',{className:'btn'+(st.female===v?' on':''),textContent:t,id:v?'female':'male'});b.onclick=()=>{st.female=v;render()};gb.append(b)});hd.append(gb);o.append(hd);
    sec('Twarz',FACES.map((_,i)=>thumbBtn('face-'+i,st.face===i,()=>{st.face=i;render()},{face:i})));
    sec('Fryzura',HAIR_STYLES.map(h=>thumbBtn('hair-'+h,st.hairStyle===h,()=>{st.hairStyle=h;render()},{hairStyle:h},HAIR_NAMES[h])));
  }
  if(st.tab==='barwy'){
    sec('Kolor włosów',HAIR_COLORS.map((c,i)=>{const b=el('button',{className:'sw'+(st.hair===c?' on':''),id:'hc-'+i});b.style.background=c;b.onclick=()=>{st.hair=c;render()};return b}));
    sec('Karnacja',SKIN_TONES.map((c,i)=>{const b=el('button',{className:'sw'+(st.skin===c?' on':''),id:'sk-'+i});b.style.background=c;b.onclick=()=>{st.skin=c;render()};return b}));
  }
  if(st.tab==='stroj'){
    sec('Część stroju',COLOR_SLOTS.map((t,i)=>{const b=el('button',{className:'btn'+(st.slot===i?' on':''),textContent:t,id:'slot-'+i});b.onclick=()=>{st.slot=i;render()};return b}));
    sec('Kolor',SWATCHES.map((c,i)=>{const b=el('button',{className:'sw'+(st.colors[st.slot]===c?' on':''),id:'sc-'+i});b.style.background=c;b.onclick=()=>{st.colors[st.slot]=c;render()};return b}));
  }
  if(st.tab==='org'){
    ORIGINS.forEach((x,i)=>{const b=el('button',{className:'org'+(st.origin===i?' on':''),id:'org-'+i},[el('div',{className:'t'},[el('b',{textContent:x.name}),el('i',{textContent:x.bonusText})]),el('span',{textContent:x.story})]);b.onclick=()=>{st.origin=i;render()};o.append(b)});
  }
  if(st.tab==='cechy'){
    o.append(el('h2',{textContent:`Wybierz ${MAX_TRAITS}: każda ma plus i skazę`}));o.append(el('div',{id:'msg'}));
    const tr=el('div',{className:'traits'});TRAITS.forEach(t=>{const on=st.traits.includes(t.id);const fmt=d=>Object.entries(d).map(([k,v])=>`${v>0?'+':''}${v} ${({hp:'życia',initiative:'inicjatywy',earth:'mocy Ziemi',fire:'mocy Ognia',water:'mocy Wody',air:'mocy Powietrza',resistAll:'odporności'})[k]}`).join(', ');
      const b=el('button',{className:'btn chip'+(on?' on':''),id:'tr-'+t.id},[document.createTextNode(t.name),el('small',{textContent:`${fmt(t.plus)}; ${fmt(t.minus)}`})]);
      b.onclick=()=>{if(on)st.traits=st.traits.filter(x=>x!==t.id);else if(st.traits.length>=MAX_TRAITS){$('msg').textContent=`Maksymalnie ${MAX_TRAITS} cechy. Odznacz jedną.`;return}else st.traits=[...st.traits,t.id];render()};tr.append(b)});o.append(tr);
  }
  if(st.tab==='gotowe'){
    const s=stats(),c=CLASSES[st.classId],sm=el('div',{id:'sum'});
    sm.innerHTML=`<b>${st.name||'Bezimienny'}</b>, ${c.name}<br>Życie <b>${s.hp}</b> · PA <b>${s.pa}</b> · PM <b>${s.pm}</b> · Inicjatywa <b>${s.initiative}</b><br>Moc: Ziemia ${s.earth} · Ogień ${s.fire} · Woda ${s.water} · Powietrze ${s.air} · Odporność ${s.resist.earth}%${s.spellPoints?` · Punkty czaru ${s.spellPoints}`:''}<br>Czary: ${c.spells.map(x=>x.name).join(', ')}`
      +(st.saved===true?'<br><b style="color:var(--ember)">Bohater zapisany.</b> <a href="postac.html" style="color:#ffb070">Karta postaci</a> · <a href="walka.html" style="color:#ffb070">Do walki</a>':st.saved===false?'<br><b style="color:#e08a6a">Nie udało się zapisać postaci (przeglądarka blokuje pamięć).</b>':'');
    o.append(sm);
  }
  const ft=$('foot');ft.innerHTML='';const go=el('button',{className:'btn go',textContent:'Zejdź do areny',id:'go'});
  go.onclick=()=>{const s=stats();window.__hero={name:st.name||'Bezimienny',classId:st.classId,look:spec(),origin:ORIGINS[st.origin].id,traits:[...st.traits],stats:s};const look={female:st.female,skin:st.skin,hair:st.hair,hairStyle:st.hairStyle,face:st.face,colors:[...st.colors]},ch=newCharacter({name:st.name||'Bezimienny',classId:st.classId,origin:ORIGINS[st.origin].id,traits:st.traits,look}),ok=saveCharacter(ch);window.__saved=ok;st.saved=ok;st.tab='gotowe';render();console.log(JSON.stringify(window.__hero))};ft.append(go);
  o.scrollTop=keep;
}
function render(){build();$('nm').value=st.name}
$('nm').oninput=e=>{st.name=e.target.value;const b=$('sum')&&$('sum').querySelector('b');if(b)b.textContent=st.name||'Bezimienny'};
$('rnd').onclick=()=>{st.nameSeed++;st.heroSeed++;const r=randomHeroOpts(st.nameSeed);Object.assign(st,{female:r.female,skin:r.skin,hair:r.hair,hairStyle:r.hairStyle,face:r.face,colors:r.colors,name:randomName(st.nameSeed)});render()};
$('left').onclick=()=>{st.dir=(st.dir+3)%4};$('right').onclick=()=>{st.dir=(st.dir+1)%4};
$('walk').onclick=()=>{st.walk=!st.walk;$('walk').classList.toggle('on',st.walk)};
const cv=$('view'),g=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
addEventListener('resize',fit);
function frame(now){const W=cv.width,H=cv.height;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  const grad=g.createRadialGradient(W/2,H*.55,10,W/2,H*.55,Math.max(W,H)*.6);grad.addColorStop(0,'#3a2a26');grad.addColorStop(1,'#140e10');g.fillStyle=grad;g.fillRect(0,0,W,H);
  const sp=spec(),sc=Math.min(H*.6/90,W*.55/46),cx=W/2,fy=H*.78;
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(cx,fy+4,sc*16,sc*5,0,0,7);g.fill();
  drawCharacter(g,cx,fy,{...sp,sc:sp.sc*sc/1.0},{...dirOpt(),t:st.walk?(now/700)%1:undefined});
  requestAnimationFrame(frame)}
fit();render();requestAnimationFrame(frame);
window.__kreator={get state(){return st},get hero(){return window.__hero||null},spec};
</script></body></html>
