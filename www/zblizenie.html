<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Zbliżenie</title><style>body{margin:0;background:#1d2418}canvas{display:block}</style></head><body>
<canvas id="c" width="1500" height="900"></canvas>
<script type="module">
import {genBuilding,drawBuilding} from '../src/art/buildings.js';
import {PROPS} from '../src/art/props.js';
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.fillStyle='#8fcf52';g.fillRect(0,0,1500,900);
g.save();g.scale(2.6,2.6);
// budynki z elementami, które były rysowane wprost na ekran: szczyt z okienkiem, lukarna, szyld, lampa
[['townhouse',8],['tavern',11],['cottage',12],['shop',23]].forEach(([k,sd],i)=>{drawBuilding(g,70+i*140,150,genBuilding(sd,k))});
g.restore();
// rekwizyty w powiększeniu
g.save();g.scale(4,4);
['logs','haybale','cart','bench','crate','barrel'].forEach((n,i)=>PROPS[n](g,30+i*60,200,1.2,3));
g.restore();
</script></body></html>
