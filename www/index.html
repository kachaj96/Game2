<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14110f"><title>Arena Iso</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 20% 0%,#2a3a22 0%,#14110f 60%);color:#e6dcc8;font:16px/1.5 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
main{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;max-width:820px;width:100%}
h1{font:400 clamp(34px,9vw,60px)/1 Georgia,serif;letter-spacing:.03em;margin:0}h1 small{display:block;font:500 14px system-ui;color:#9a8f7c;letter-spacing:.12em;text-transform:uppercase;margin-top:10px}
.menu{display:flex;flex-direction:column;gap:10px}
.menu a,.menu button{display:flex;align-items:center;justify-content:center;min-height:52px;border:0;border-radius:12px;background:#3a2c26;color:#fff;font:700 17px system-ui;text-decoration:none;padding:0 16px}
.menu .go{background:#b4501c}.menu .sub{background:#2a2622;font-weight:500;font-size:14px;min-height:42px;color:#c9bfae}
#who{background:#1d1917;border:1px solid #3a3230;border-radius:12px;padding:10px 14px;font-size:14px;color:#c9bfae}#who b{color:#fff}
@media (max-width:640px){main{grid-template-columns:1fr;gap:16px}}
</style></head><body><main>
<div><h1>Arena Iso<small>taktyczna gra turowa</small></h1><p id="who" style="margin-top:18px"></p></div>
<div class="menu"><a class="go" id="play" href="kreator.html">Nowa gra</a><a id="chr" href="postac.html?back=index.html" style="display:none">Karta postaci</a><button id="reset" class="sub" style="display:none">Zacznij od nowa (usuń postać)</button><a class="sub" href="podglad.html">Podgląd grafiki (dla twórcy)</a></div>
</main>
<script type="module">
import {loadCharacter,clearCharacter} from '../src/game/save.js';
import {CLASSES} from '../src/game/classdata.js';
import {levelFromXp,clearRun} from '../src/game/run.js';
const $=id=>document.getElementById(id),ch=loadCharacter();
if(ch){const lv=levelFromXp(ch.xp||0);$('who').innerHTML='<b>'+ch.name.replace(/[<>&]/g,'')+'</b>, '+(CLASSES[ch.classId]?.name||ch.classId)+'<br>Poziom '+ch.level+(lv.need?' · '+lv.into+'/'+lv.need+' XP':'');$('play').textContent='Graj dalej';$('play').href='swiat.html';$('chr').style.display='';$('reset').style.display=''}
else $('who').textContent='Brak zapisanej postaci. Stwórz bohatera i wejdź do świata.';
$('reset').onclick=()=>{if(confirm('Usunąć postać i zacząć od nowa?')){clearCharacter();clearRun();location.reload()}};
</script></body></html>
