<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Ikony czarów, koncept</title><style>body{margin:0;background:#121014}canvas{display:block}</style></head><body>
<canvas id="c" width="1500" height="1130"></canvas>
<script type="module">
import {CLASS_LIST,ELEMENTS} from '../src/game/classdata.js';
import {drawSpellIcon} from '../src/art/spellicons.js';
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.fillStyle='#121014';g.fillRect(0,0,1500,1130);
const T=(t,x,y,size=16,col='#e8dcc0',al='left',w='')=>{g.font=`${w} ${size}px system-ui`;g.fillStyle=col;g.textAlign=al;g.textBaseline='alphabetic';g.fillText(t,x,y)};
T('Ikony czarów: koncept do akceptacji',30,46,28,'#f0e6d0','left','bold');
T('Kolor i kształt ramki zależą od żywiołu, symbol jest unikalny dla czaru. Liczba w rogu to koszt PA.',30,72,15,'#a89878');
// 1. czary klas
CLASS_LIST.forEach((c,ci)=>{const x0=40+ci*490;T(c.name+' ('+c.role+')',x0,122,20,'#f0e6d0','left','bold');
  c.spells.forEach((s,i)=>{const x=x0+60+i*150;drawSpellIcon(g,{...s,pa:s.levels[0].pa},x,210,96);T(s.name,x,282,14,'#e8dcc0','center','bold');T(ELEMENTS[s.element].name,x,301,13,ELEMENTS[s.element].color,'center','bold')})});
// 2. żywioły
T('Żywioły (plus odporności przeciwników w %)',40,360,20,'#f0e6d0','left','bold');
Object.values(ELEMENTS).forEach((e,i)=>{const x=110+i*270;drawSpellIcon(g,{id:'none',element:e.id},x,430,72);T(e.name,x+50,420,17,e.color,'left','bold');T(['kwadrat','koło','sześciokąt','romb','tarcza'][i]+' + kolor',x+50,442,13,'#a89878')});
// 3. stany ikony
T('Stany ikony (na przykładzie Żaru)',40,520,20,'#f0e6d0','left','bold');
const z=CLASS_LIST[2].spells[0];
[['zwykły',{}],['wybrany',{selected:true}],['za mało PA',{noPa:true,disabled:true}],['odnowienie 2',{cooldown:2}],['wkrótce',{soon:true}]].forEach(([n,st],i)=>{const x=110+i*270;drawSpellIcon(g,{...z,pa:3},x,590,80,st);T(n,x+54,594,15,'#e8dcc0')});
// 4. makieta paska w układzie poziomym (860 x 412)
T('Makieta paska skrótów w poziomie (860 x 412) i karty informacji',40,690,20,'#f0e6d0','left','bold');
const X=40,Y=715,W=860,H=380;g.fillStyle='#16241a';g.fillRect(X,Y,W,H);g.strokeStyle='#3a4a3a';g.lineWidth=2;g.strokeRect(X,Y,W,H);
g.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<7;i++){g.beginPath();g.moveTo(X+330+i*40,Y+110+i*20);g.lineTo(X+330+i*40+240,Y+110+i*20+120);g.stroke()}
// plansza (symbolicznie)
g.fillStyle='rgba(90,150,255,.25)';g.beginPath();g.moveTo(X+430,Y+150);g.lineTo(X+520,Y+195);g.lineTo(X+430,Y+240);g.lineTo(X+340,Y+195);g.closePath();g.fill();
T('postacie i plansza',X+430,Y+205,13,'#8aa88a','center');
// HUD
g.fillStyle='rgba(10,14,8,.75)';g.beginPath();g.roundRect(X+10,Y+10,330,34,10);g.fill();T('Runda 1: Ty   Życie 38/38   PM 3/3   PA 6/6',X+22,Y+32,14,'#e8f0d0','left','bold');
// karta wroga (po lewej)
g.fillStyle='rgba(10,14,8,.82)';g.beginPath();g.roundRect(X+10,Y+60,200,150,12);g.fill();T('Strażnik  22/22',X+22,Y+84,15,'#f0e6d0','left','bold');T('Odporności',X+22,Y+104,12,'#a89878');
[['earth',30],['fire',-20],['water',0],['air',10]].forEach(([e,v],i)=>{const cx=X+36+(i%2)*92,cy=Y+130+Math.floor(i/2)*34;drawSpellIcon(g,{id:'none',element:e},cx,cy,34);T((v>0?'+':'')+v+'%',cx+22,cy+5,15,v>0?'#8ac88a':v<0?'#e08a6a':'#a8a8a8','left','bold')});
// karta czaru nad paskiem
g.fillStyle='rgba(10,14,8,.9)';g.beginPath();g.roundRect(X+250,Y+236,360,66,12);g.fill();
T('Żar  (Ogień)  3 PA  zasięg 2-6, widoczność',X+264,Y+258,14,'#ffb090','left','bold');T('12-16 obrażeń, przy odporności +30%:  8-11',X+264,Y+280,14,'#e8dcc0');T('Dotknij ponownie, by rzucić',X+264,Y+296,12,'#a89878');
// pasek 6 slotów + strony
const bx=X+150,by=Y+346;g.fillStyle='rgba(10,14,8,.85)';g.beginPath();g.roundRect(bx-40,by-34,560,68,16);g.fill();
T('‹',bx-20,by+8,28,'#e8dcc0','center','bold');T('›',bx+500,by+8,28,'#e8dcc0','center','bold');T('1/3',bx+250,by-38,12,'#a89878','center');
const all=CLASS_LIST.flatMap(c=>c.spells);
for(let i=0;i<6;i++){const sp=all[(i+6)%9];drawSpellIcon(g,{...sp,pa:sp.levels[0].pa},bx+30+i*80,by,56,i===1?{selected:true}:i===4?{cooldown:2}:i===5?{soon:true}:{})}
// przycisk końca tury
g.fillStyle='#3b6a2a';g.beginPath();g.roundRect(X+W-190,Y+H-74,172,56,14);g.fill();T('Koniec tury',X+W-104,Y+H-40,17,'#fff','center','bold');
// opis po prawej
T('Układ i wymiary',920,740,18,'#f0e6d0','left','bold');
['6 widocznych ikon, 56 px, strony przyciskami ‹ › lub przesunięciem',' do 4 stron = 24 skróty, przypisywane w Księdze Czarów','dotknięcie wybiera czar i pokazuje kartę z liczbami','drugie dotknięcie celu rzuca (jak teraz)','dotknięcie wroga pokazuje jego odporności','kolor liczb obrażeń = żywioł czaru','plansza zostaje wyśrodkowana nad paskiem'].forEach((t,i)=>T('• '+t,920,772+i*28,15,'#c8bca0'));
</script></body></html>
