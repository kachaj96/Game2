<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Walka</title>
<style>
:root{--s:min(60px,calc((100vw - 36px) / 8.8))}
html,body{margin:0;height:100%;background:#0c1210;color:#e8f0d0;font:15px system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pill{position:absolute;background:rgba(10,14,8,.8);border-radius:12px;padding:8px 12px}
#hud{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));font-weight:700;display:flex;gap:14px;pointer-events:none}
#msg{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));max-width:42vw;color:#c6d6a6;font-size:13px;text-align:right;pointer-events:none}
#msg:empty{display:none}
#foe{left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 50px);display:none;min-width:150px}
#foe b{display:block;margin-bottom:4px}
#foe .rs{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
#foe .r{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
#foe canvas{width:30px;height:30px}
#card{left:50%;transform:translateX(-50%);bottom:calc(var(--s) + 34px);max-width:min(94vw,540px);display:none;font-size:14px;line-height:1.4;text-align:center}
#card small{color:#a89878;display:block}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:rgba(10,14,8,.85);border-radius:18px;padding:6px 8px;touch-action:none}
#slots{display:flex;gap:6px;min-width:calc(var(--s) * 6 + 30px)}
.slot{width:var(--s);height:var(--s);padding:0;border:0;border-radius:14px;background:transparent;touch-action:none}
.slot canvas{width:100%;height:100%;display:block}
.pg{width:calc(var(--s) * .6);height:var(--s);border:0;border-radius:12px;background:#2c2022;color:#e8dcc0;font-size:24px;touch-action:manipulation}
.pg:disabled{opacity:.3}
#pgi{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:12px;color:#a89878}
button{font-family:inherit}
#end{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:min(170px,26vw);height:calc(var(--s) + 12px);border:0;border-radius:14px;background:#3b6a2a;color:#fff;font:700 16px system-ui;box-shadow:0 3px 10px rgba(0,0,0,.4);touch-action:manipulation}
#end:disabled{background:#2a3324;color:#6a7a5a;box-shadow:none}
@media (orientation:landscape) and (min-width:600px){
  :root{--s:54px}
  #bar{left:auto;right:max(10px,env(safe-area-inset-right));transform:none;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 66px);display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"slots slots" "prev next";gap:6px;padding:8px}
  #slots{grid-area:slots;display:grid;grid-template-columns:repeat(3,var(--s));min-width:0}
  #prev{grid-area:prev;width:auto;height:40px}#next{grid-area:next;width:auto;height:40px}
  #end{width:calc(var(--s) * 3 + 12px + 16px);height:56px}
  #card{left:max(8px,env(safe-area-inset-left));transform:none;bottom:max(10px,env(safe-area-inset-bottom));max-width:36vw;text-align:left}
}
@media (max-width:760px) and (orientation:portrait){#msg{top:calc(max(8px,env(safe-area-inset-top)) + 50px);left:max(8px,env(safe-area-inset-left));right:auto;text-align:left;max-width:78vw}#foe{top:calc(max(8px,env(safe-area-inset-top)) + 100px)}#end{bottom:calc(var(--s) + 34px + 10px);width:min(150px,36vw);height:48px}}
#banner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,8,6,.7);font:800 44px Georgia,serif}
#banner button{background:#b4501c;width:220px;height:58px;border:0;border-radius:14px;color:#fff;font:700 17px system-ui}
</style></head><body><div id="app">
<canvas id="c"></canvas>
<div id="hud" class="pill"><span id="who">Walka</span><span id="pts"></span></div>
<div id="msg" class="pill"></div>
<div id="foe" class="pill"></div>
<div id="card" class="pill"></div>
<div id="bar"><span id="pgi"></span><button class="pg" id="prev" aria-label="Poprzednia strona">‹</button><div id="slots"></div><button class="pg" id="next" aria-label="Następna strona">›</button></div>
<button id="end">Koniec tury</button>
<div id="banner"><span id="bt"></span><button id="again">Jeszcze raz</button></div></div>
<script type="module">
import {IsoGrid} from '../src/grid.js';
import {genCharacter,drawCharacter,DIRS} from '../src/art/characters.js';
import {heroSpec} from '../src/art/classes.js';
import {drawGridLines,fillCells,drawCellOutline} from '../src/art/gridview.js';
import * as N from '../src/art/nature.js';
import {grave,ashCloud} from '../src/art/props.js';
import {applyMood,glow} from '../src/art/mood.js';
import {drawSpellIcon} from '../src/art/spellicons.js';
import {createState,currentUnit,unitById,gridOf,occupied} from '../src/game/state.js';
import {applyCommand,legalMoves,ERRORS} from '../src/game/commands.js';
import {findPath} from '../src/game/pathfinding.js';
import {chooseCommand} from '../src/game/ai.js';
import {CLASSES,ELEMENTS,DEV_SPELLS,findSpellDef} from '../src/game/classdata.js';
import {castProblem,validTargets,damageRange,damageRangeVs,elementOfSpell,spellData,implemented} from '../src/game/spells.js';
import {spawn} from '../src/game/bestiary.js';

const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),mood=Q.get('mood')||'noc',scenario=Q.get('scenario')||'default',HERO=Q.get('hero')||'zalobnik',ALL=Q.get('spells')==='all',PAGE=6;
const WORLD={w:540,h:356},grid=new IsoGrid(7,7,{x:WORLD.w/2,y:84});
let view={s:1,ox:0,oy:0};
const guard=(id,x,y,seed,arch='straznik')=>spawn(arch,id,x,y,{role:'warrior',seed});
const hero=(x,y)=>({id:'h',team:'gracz',name:'Ty',classId:HERO,seed:3,x,y,initiative:99,...(ALL?{spells:[...CLASSES[HERO].spells,...DEV_SPELLS].map(s=>({id:s.id,level:1}))}:{})});
const SCEN={
  default:{blocked:[{x:3,y:2},{x:4,y:2},{x:2,y:4},{x:4,y:4},{x:0,y:3}],units:[hero(1,5),guard('e1',5,1,9),guard('e2',5,3,21,'popielny')]},
  cast:{blocked:[],units:[hero(2,4),guard('e1',5,4,9)]},
  wall:{blocked:[{x:3,y:4}],units:[hero(1,4),guard('e1',5,4,9)]},
  push:{blocked:[{x:6,y:4}],units:[hero(2,4),guard('e1',4,4,9)]},
};
let state,look,facing,lastPos,preview=null,selSpell=null,anim=null,busy=false,pendingResult=null,floats=[],shake=new Map(),page=0,inspect=null,swiped=false;
function newGame(){const sc=SCEN[scenario]||SCEN.default;state=createState({cols:7,rows:7,seed:42,blocked:sc.blocked,units:sc.units});
  look=new Map(state.units.map(u=>[u.id,u.id==='h'?heroSpec(HERO,{face:1,hairStyle:'long',hair:'#c8c8d0',skin:'#f0c49a'}):genCharacter(u.seed,u.role)]));
  facing=new Map(state.units.map(u=>[u.id,u.team==='gracz'?'SE':'SW']));lastPos=new Map(state.units.map(u=>[u.id,{x:u.x,y:u.y}]));
  preview=null;selSpell=null;anim=null;busy=false;pendingResult=null;floats=[];inspect=null;page=0;$('banner').style.display='none';hud();say('Twoja tura: dotknij kafla, by zobaczyć drogę, dotknij ponownie, by iść.')}
const dirFor=(dx,dy)=>dx>0?'SE':dx<0?'NW':dy>0?'SW':'NE';   // x rośnie w prawo-dół, y w lewo-dół
const COL={earth:'#d2a45c',fire:'#ff6a3a',water:'#5ab0ff',air:'#7ae07a',neutral:'#e8e8e8'};

const bg=document.createElement('canvas');
function renderBg(){bg.width=cv.width;bg.height=cv.height;const b=bg.getContext('2d');
  N.ground(b,bg.width,bg.height,7,{biome:'dark'});N.tufts(b,bg.width,bg.height,7,Math.round(bg.width*bg.height/1400),null,{biome:'dark'});
  b.setTransform(view.s,0,0,view.s,view.ox,view.oy);drawGridLines(b,grid,'rgba(255,255,255,.22)')}
const isLand=()=>matchMedia('(orientation:landscape) and (min-width:600px)').matches;
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(2,Math.round(r.width*dpr));cv.height=Math.max(2,Math.round(r.height*dpr));
  const bar=$('bar').getBoundingClientRect(),land=isLand(),topPad=14*dpr,botPad=(land?14:bar.height+26)*dpr,rightPad=(land?bar.width+22:0)*dpr;
  const availW=cv.width-rightPad,availH=cv.height-botPad-topPad,s=Math.min(availW/WORLD.w,availH/WORLD.h);
  view={s,ox:(availW-WORLD.w*s)/2,oy:topPad+(availH-WORLD.h*s)/2};renderBg()}
addEventListener('resize',resize);
const toWorld=(cx,cy)=>{const r=cv.getBoundingClientRect(),px=(cx-r.left)*cv.width/r.width,py=(cy-r.top)*cv.height/r.height;return[(px-view.ox)/view.s,(py-view.oy)/view.s]};
const toCss=(wx,wy)=>{const r=cv.getBoundingClientRect();return[(view.ox+wx*view.s)*r.width/cv.width,(view.oy+wy*view.s)*r.height/cv.height]};

const say=t=>$('msg').textContent=t;
const me=()=>unitById(state,'h');
const spellList=()=>me().spells.map(k=>({k,def:findSpellDef(me().classId,k.id),sd:spellData(me(),k.id)}));
const mineNow=()=>currentUnit(state).team==='gracz'&&!busy&&!state.result;
function slotInfo(it){const h=me(),d=it.sd.data,id=it.k.id,cd=h.cooldowns[id]||0,impl=implemented(d),noPa=h.pa<d.pa,lim=(h.casts[id]||0)>=d.perTurn,mine=mineNow();
  const ready=mine&&impl&&!noPa&&cd===0&&!lim;
  const st=!impl?'soon':cd>0?`cooldown:${cd}`:lim?'limit':noPa?'noPa':mine?'ready':'wait';
  return{ready,st,reason:!impl?'Ten czar jeszcze nie działa.':cd>0?`Czar wróci za ${cd} t.`:lim?ERRORS.limit:noPa?ERRORS.no_pa:'Teraz nie możesz rzucać.',icon:{selected:selSpell===id,soon:!impl,cooldown:cd,noPa:noPa&&impl,disabled:!ready&&impl&&cd===0}}}
function renderBar(){
  const L=spellList(),pages=Math.max(1,Math.ceil(L.length/PAGE));page=Math.min(page,pages-1);
  const box=$('slots');box.innerHTML='';
  for(const it of L.slice(page*PAGE,page*PAGE+PAGE)){
    const inf=slotInfo(it),b=document.createElement('button'),c=document.createElement('canvas');b.className='slot';b.id='slot-'+it.k.id;b.setAttribute('aria-label',it.def.name);b.dataset.state=inf.st;
    if(!inf.ready)b.setAttribute('aria-disabled','true');c.width=c.height=120;b.append(c);
    drawSpellIcon(c.getContext('2d'),{...it.def,pa:it.sd.data.pa},60,60,112,inf.icon);
    b.onclick=()=>{if(swiped){swiped=false;return}pickSpell(it.k.id)};box.append(b)}
  $('pgi').textContent=pages>1?`${page+1}/${pages}`:'';$('prev').style.visibility=$('next').style.visibility=pages>1?'visible':'hidden';$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
function go(dir){const pages=Math.max(1,Math.ceil(me().spells.length/PAGE));page=Math.max(0,Math.min(pages-1,page+dir));renderBar()}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
{let sx=null;const bar=$('bar');bar.addEventListener('pointerdown',e=>{sx=e.clientX;swiped=false});
 bar.addEventListener('pointermove',e=>{if(sx!=null&&!swiped&&Math.abs(e.clientX-sx)>40){swiped=true;go(e.clientX<sx?1:-1);sx=e.clientX}});
 bar.addEventListener('pointerup',()=>{sx=null;setTimeout(()=>{swiped=false},50)});bar.addEventListener('pointercancel',()=>{sx=null})}

function chipCanvas(el){const c=document.createElement('canvas');c.width=c.height=60;drawSpellIcon(c.getContext('2d'),{id:'none',element:el},30,30,56);return c}
function renderFoe(){
  const box=$('foe');const tgt=preview&&preview.kind==='cast'?state.units.find(q=>q.hp>0&&q.x===preview.x&&q.y===preview.y):inspect&&state.units.find(q=>q.id===inspect&&q.hp>0);
  if(!tgt){box.style.display='none';return}
  const kn=state.known[tgt.id]||{};box.style.display='block';box.innerHTML=`<b>${tgt.name||tgt.id} ${tgt.hp}/${tgt.maxHp}</b><div class="rs"></div>`;
  for(const e of ['earth','fire','water','air','neutral']){const r=document.createElement('div');r.className='r';r.dataset.el=e;r.append(chipCanvas(e));const v=document.createElement('span');
    if(kn[e]!==undefined){v.textContent=(kn[e]>0?'+':'')+kn[e]+'%';v.style.color=kn[e]>0?'#8ac88a':kn[e]<0?'#e08a6a':'#c8c8c8'}else{v.textContent='?';v.style.color='#777'}r.append(v);box.querySelector('.rs').append(r)}
}
function renderCard(){
  const box=$('card');if(!selSpell){box.style.display='none';return}
  const h=me(),def=findSpellDef(h.classId,selSpell),d=spellData(h,selSpell).data,el=ELEMENTS[def.element],[lo,hi]=damageRange(h,d,def.element);
  let dm=`obrażenia ${lo}-${hi}`,sub='';
  if(preview&&preview.kind==='cast'){const t=state.units.find(q=>q.hp>0&&q.x===preview.x&&q.y===preview.y),kn=t&&state.known[t.id]?.[def.element];
    if(kn!==undefined){const [a,b]=damageRangeVs(h,d,def.element,t);dm=`obrażenia ${a}-${b} (odporność ${kn>0?'+':''}${kn}%)`}else dm+=' (odporność nieznana)';sub='Dotknij ponownie, by rzucić'}
  else sub='Wybierz cel na podświetlonych kaflach';
  box.style.display='block';box.innerHTML=`<b style="color:${COL[def.element]}">${def.name}</b> <span style="color:${COL[def.element]}">(${el.name})</span> · ${d.pa} PA · zasięg ${d.min}-${d.max}${d.line?' w linii':''}${d.los?', widoczność':''}${d.cd?` · odnowienie ${d.cd}`:''}<br>${dm}${d.push?` · odpycha o ${d.push}`:''}<small>${sub}</small>`;
}
function hud(){const u=currentUnit(state),h=me();
  $('who').textContent=`Runda ${state.turn.round}: ${u.name}`;$('pts').textContent=`Życie ${h.hp}/${h.maxHp}   PM ${h.pm}/${h.maxPm}   PA ${h.pa}/${h.maxPa}`;
  $('end').disabled=!mineNow();renderBar();renderCard();renderFoe();resizeSoon()}
let rs=0,sig='';function resizeSoon(){if(rs)return;rs=setTimeout(()=>{rs=0;const b=$('bar').getBoundingClientRect(),n=Math.round(b.width)+'x'+Math.round(b.height);if(n!==sig){sig=n;resize()}},0)}
function pickSpell(id){
  if(busy||state.result)return;const it=spellList().find(x=>x.k.id===id),inf=slotInfo(it);
  if(!inf.ready&&selSpell!==id){say(inf.reason);return}
  selSpell=selSpell===id?null:id;preview=null;inspect=null;
  if(selSpell){const pi=Math.floor(spellList().findIndex(x=>x.k.id===id)/PAGE);page=pi}
  say(selSpell?'Wybierz cel na podświetlonych kaflach.':'Wybór czaru anulowany.');hud()}
const pathTo=(u,c)=>{const p=findPath(gridOf(state),u,c,occupied(state,u.id));return p&&p.length<=u.pm?p:null};

function act(cmd){
  const r=applyCommand(state,cmd);if(!r.ok){say(r.message);return null}
  state=r.state;preview=null;
  for(const e of r.events){
    if(e.type==='moved'){busy=true;anim={kind:'move',unit:e.unit,cells:[lastPos.get(e.unit),...e.path],t:0}}
    if(e.type==='cast'){busy=true;anim=anim||{kind:'wait',t:0,dur:.8};
      const c=grid.center(e.to.x,e.to.y);for(const h of e.hits){addFloat(c,h);shake.set(h.unit,0)}
      facing.set(e.unit,dirFor(Math.sign(e.to.x-lastPos.get(e.unit).x)||0,Math.sign(e.to.y-lastPos.get(e.unit).y)||0)||facing.get(e.unit))}
    if(e.type==='pushed'){busy=true;anim={kind:'slide',unit:e.unit,from:e.from,to:e.to,t:0,dur:.8};shake.set(e.unit,0);
      const c=grid.center(e.to.x,e.to.y);for(const h of e.hits){addFloat([c[0]+(h.unit===e.unit?0:14),c[1]],h);shake.set(h.unit,0)}}
    if(e.type==='finished')pendingResult=e.result}
  hud();return r;
}
function addFloat(c,h){const mark=h.kind==='spell'?(h.resist<0?' ▲':h.resist>=25?' ▼':''):'';floats.push({x:c[0],y:c[1]-46,text:'-'+h.dmg+mark,color:h.kind==='collision'?'#d8d8d8':COL[h.element]||'#e02a2a',t:0})}
function afterAnim(){
  busy=false;for(const u of state.units)lastPos.set(u.id,{x:u.x,y:u.y});
  if(pendingResult){showResult();return}
  const u=currentUnit(state);hud();
  if(u.team==='wrog'){busy=true;hud();setTimeout(()=>{const r=act(chooseCommand(state));if(!r)busy=false;else if(!anim)afterAnim();hud()},380)}
  else say('Twoja tura: dotknij kafla, by zobaczyć drogę, dotknij ponownie, by iść.');
}
function showResult(){busy=true;$('bt').textContent=pendingResult==='victory'?'Zwycięstwo':'Porażka';$('banner').style.display='flex';hud()}
$('again').onclick=newGame;

function tap(sx,sy){
  if(busy||state.result)return;const u=currentUnit(state);if(u.team!=='gracz')return;
  const c=grid.cellAt(sx,sy);if(!c){preview=null;hud();return}
  const foe=state.units.find(q=>q.hp>0&&q.team==='wrog'&&q.x===c.x&&q.y===c.y);
  if(selSpell){
    const err=castProblem(state,u.id,selSpell,c);
    if(err){preview=null;say(ERRORS[err]||'Nie można tu rzucić.');hud();return}
    if(preview&&preview.kind==='cast'&&preview.x===c.x&&preview.y===c.y){const sp=selSpell;selSpell=null;if(act({type:'cast',unit:u.id,spell:sp,to:{x:c.x,y:c.y}})&&!anim)afterAnim();return}
    const kn=foe&&state.known[foe.id]?.[elementOfSpell(u,selSpell)],[lo,hi]=foe&&kn!==undefined?damageRangeVs(u,spellData(u,selSpell).data,elementOfSpell(u,selSpell),foe):damageRange(u,spellData(u,selSpell).data,elementOfSpell(u,selSpell));
    preview={kind:'cast',x:c.x,y:c.y,lo,hi,known:kn!==undefined};say(`Dotknij ponownie, by rzucić (${lo}-${hi}${kn===undefined?'?':''} obrażeń).`);hud();return}
  if(foe){inspect=foe.id;preview=null;say(`${foe.name}: odporności odkrywasz, trafiając go żywiołami.`);hud();return}
  inspect=null;
  if(preview&&preview.kind==='move'&&preview.x===c.x&&preview.y===c.y){const p=preview;act({type:'move',unit:u.id,to:{x:p.x,y:p.y}});return}
  const m=legalMoves(state,u.id).get(grid.key(c.x,c.y));
  if(m){preview={kind:'move',x:c.x,y:c.y,path:pathTo(u,c),cost:m.cost};say(`Dotknij ponownie, by pójść (${m.cost} PM).`)}
  else{preview=null;say(gridOf(state).isBlocked(c.x,c.y)?'Tu nie da się wejść.':'Za daleko albo zajęte.')}
  hud();
}
cv.addEventListener('pointerdown',e=>{const [wx,wy]=toWorld(e.clientX,e.clientY);tap(wx,wy);e.preventDefault()});
$('end').addEventListener('click',()=>{if(busy||state.result)return;const u=currentUnit(state);if(u.team!=='gracz')return;selSpell=null;inspect=null;if(act({type:'endTurn',unit:u.id})&&!anim)afterAnim()});

function visual(u){
  const lp=lastPos.get(u.id);
  if(anim&&anim.kind==='slide'&&anim.unit===u.id){const f=Math.min(1,anim.t/.35),e=1-(1-f)*(1-f),a=anim.from,b=anim.to,A=grid.center(a.x,a.y),B=grid.center(b.x,b.y);
    return{x:A[0]+(B[0]-A[0])*e,y:A[1]+(B[1]-A[1])*e,walk:undefined,gx:a.x+(b.x-a.x)*e,gy:a.y+(b.y-a.y)*e}}
  if(anim&&anim.kind==='move'&&anim.unit===u.id){const i=Math.min(anim.cells.length-2,Math.floor(anim.t)),f=anim.t-i,a=anim.cells[i],b=anim.cells[i+1];
    const A=grid.center(a.x,a.y),B=grid.center(b.x,b.y);facing.set(u.id,dirFor(b.x-a.x,b.y-a.y));
    return{x:A[0]+(B[0]-A[0])*f,y:A[1]+(B[1]-A[1])*f,walk:(anim.t*1.5)%1,gx:a.x+(b.x-a.x)*f,gy:a.y+(b.y-a.y)*f}}
  const [x,y]=grid.center(lp.x,lp.y);return{x,y,walk:undefined,gx:lp.x,gy:lp.y};
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(anim){anim.t+=dt*(anim.kind==='move'?5:1);if(anim.kind==='move'?anim.t>=anim.cells.length-1:anim.t>=anim.dur){anim=null;afterAnim()}}
  floats=floats.filter(f=>(f.t+=dt)<1.1);for(const [k,v] of shake)if(v+dt>.35)shake.delete(k);else shake.set(k,v+dt);
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.drawImage(bg,0,0);
  g.setTransform(view.s,0,0,view.s,view.ox,view.oy);
  const cur=currentUnit(state),overlay=[],mine=mineNow();
  if(mine&&selSpell){const t=validTargets(state,cur.id,selSpell),d=spellData(cur,selSpell).data,ec=ELEMENTS[findSpellDef(cur.classId,selSpell).element].color;
    const inRange=[];for(let y=0;y<7;y++)for(let x=0;x<7;x++){const dd=Math.abs(x-cur.x)+Math.abs(y-cur.y);if(dd>=d.min&&dd<=d.max&&(!d.line||x===cur.x||y===cur.y))inRange.push({x,y})}
    fillCells(g,grid,inRange,ec+'22');fillCells(g,grid,t,ec+'77');for(const c of t)drawCellOutline(g,grid,c.x,c.y,ec,1.8)}
  else if(mine){const mv=[...legalMoves(state,cur.id).values()];fillCells(g,grid,mv,'rgba(90,150,255,.34)');for(const m of mv)drawCellOutline(g,grid,m.x,m.y,'rgba(170,210,255,.6)',1.2)}
  if(preview&&!busy){
    if(preview.kind==='move'&&preview.path){fillCells(g,grid,preview.path,'rgba(255,220,90,.42)');drawCellOutline(g,grid,preview.x,preview.y,'#ffe066',3);const c=grid.center(preview.x,preview.y);overlay.push(()=>label(c,preview.cost+' PM','#ffe066'))}
    if(preview.kind==='cast'){drawCellOutline(g,grid,preview.x,preview.y,'#ffffff',3.4);const c=grid.center(preview.x,preview.y);overlay.push(()=>label(c,`${preview.lo}-${preview.hi}${preview.known?'':'?'}`,'#ffd0a0'))}}
  const items=[];
  for(const kk of state.blocked){const x=kk%grid.cols,y=Math.floor(kk/grid.cols),c=grid.center(x,y);const t=(x*7+y*3)%3;
    items.push({d:x+y+.5,f:()=>t===0?N.rock(g,c[0],c[1]+10,x*9+y,{sc:.9}):t===1?N.stump(g,c[0],c[1]+8,x+y*5):N.deadTree(g,c[0],c[1]+10,x*3+y,{sc:.8})})}
  for(const cl of state.clouds){const c=grid.center(cl.x,cl.y);items.push({d:cl.x+cl.y+.9,f:()=>ashCloud(g,c[0],c[1]+6,1.1,cl.x*7+cl.y)})}
  for(const gr of state.graves){const c=grid.center(gr.x,gr.y);items.push({d:gr.x+gr.y+.5,f:()=>grave(g,c[0],c[1]+8,1.15)})}
  for(const u of state.units){if(u.hp<=0)continue;const v=visual(u),sp={...look.get(u.id),sc:look.get(u.id).sc*1.25},sh=shake.has(u.id)?Math.sin(shake.get(u.id)*60)*3:0;
    items.push({d:v.gx+v.gy+.5,f:()=>drawCharacter(g,v.x+sh,v.y+8,sp,{...DIRS[facing.get(u.id)],t:v.walk,ring:u.team==='gracz'?'rgb(60,120,255)':'rgb(255,70,70)'})});
    overlay.push(()=>{const w=34,bx=v.x-w/2,by=v.y-80;g.fillStyle='rgba(0,0,0,.65)';g.fillRect(bx-1,by-1,w+2,7);g.fillStyle=u.team==='gracz'?'#4ad04a':'#e04848';g.fillRect(bx,by,w*u.hp/u.maxHp,5);
      if(u.id===cur.id&&!busy&&!state.result){g.fillStyle='#ffe066';const bob=Math.sin(now/220)*3;g.beginPath();g.moveTo(v.x,by-6+bob);g.lineTo(v.x-6,by-14+bob);g.lineTo(v.x+6,by-14+bob);g.closePath();g.fill()}
      if(u.team==='gracz')glow(g,v.x+8,v.y-50,34,'255,150,70',.55)})}
  items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
  g.setTransform(1,0,0,1,0,0);applyMood(g,cv.width,cv.height,mood);
  g.setTransform(view.s,0,0,view.s,view.ox,view.oy);overlay.forEach(f=>f());
  for(const f of floats){g.globalAlpha=Math.max(0,1-f.t/1.1);g.font='bold 24px system-ui';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#000';g.strokeText(f.text,f.x,f.y-f.t*34);g.fillStyle=f.color;g.fillText(f.text,f.x,f.y-f.t*34);g.globalAlpha=1}
  requestAnimationFrame(frame);
}
function label(c,text,col){g.font='bold 15px system-ui';g.textAlign='center';const w=g.measureText(text).width+14;g.fillStyle='rgba(20,20,10,.88)';g.beginPath();g.roundRect(c[0]-w/2,c[1]-52,w,22,8);g.fill();g.fillStyle=col;g.fillText(text,c[0],c[1]-36)}
newGame();resize();requestAnimationFrame(frame);
window.__game={get state(){return state},get preview(){return preview},get busy(){return busy},get selSpell(){return selSpell},get page(){return page},grid,
  targets:(id)=>validTargets(state,'h',id),cssCenter:(x,y)=>{const c=grid.center(x,y);return toCss(c[0],c[1])}};
</script></body></html>
