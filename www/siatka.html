<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siatka izometryczna</title>
<style>body{margin:0;background:#1d2418;color:#e8f0d0;font:14px system-ui,sans-serif}canvas{display:block;margin:0 auto;cursor:crosshair}#info{text-align:center;padding:8px}</style></head><body>
<div id="info">Najedź na kafel. Klik zaznacza lub odznacza blokadę. Budynki zajmują całe kafle.</div>
<canvas id="c" width="1000" height="640"></canvas>
<script type="module">
import {IsoGrid} from '../src/grid.js';
import {genBuilding,drawBuilding,footprintCells} from '../src/art/buildings.js';
import {genCharacter,drawCharacter,DIRS} from '../src/art/characters.js';
import {drawGridLines,fillCells,drawCellOutline,drawBlocked} from '../src/art/gridview.js';
import * as N from '../src/art/nature.js';
const cv=document.getElementById('c'),g=cv.getContext('2d'),info=document.getElementById('info');
const grid=new IsoGrid(12,12,{x:cv.width/2,y:70});
// budynki: róg S w punkcie siatki, podstawa na całych kaflach
const bl=[{s:genBuilding(11,'tavern'),sx:5,sy:4},{s:genBuilding(37,'cottage'),sx:11,sy:5},{s:genBuilding(5,'tower'),sx:3,sy:9},{s:genBuilding(23,'shop'),sx:11,sy:11}];
bl.forEach(b=>grid.blockCells(footprintCells(b.s,b.sx,b.sy)));
const hero=[{sp:genCharacter(3,'mage'),x:6,y:7,d:'SE'},{sp:genCharacter(9,'warrior'),x:7,y:8,d:'SW'},{sp:genCharacter(5,'ranger'),x:4,y:6,d:'NE'}];
let hover=null;
function draw(){
  g.clearRect(0,0,cv.width,cv.height);
  N.ground(g,cv.width,cv.height,5);N.tufts(g,cv.width,cv.height,5,500);
  drawGridLines(g,grid,'rgba(255,255,255,.3)');
  const user=[...grid.blocked].map(k=>({x:k%grid.cols,y:Math.floor(k/grid.cols)})).filter(c=>!bl.some(b=>footprintCells(b.s,b.sx,b.sy).some(f=>f.x===c.x&&f.y===c.y)));
  user.forEach(c=>drawBlocked(g,grid,c.x,c.y));
  if(hover){fillCells(g,grid,[hover],grid.isBlocked(hover.x,hover.y)?'rgba(255,60,60,.35)':'rgba(60,140,255,.35)');drawCellOutline(g,grid,hover.x,hover.y)}
  const items=[];
  bl.forEach(b=>{const [x,y]=grid.toScreen(b.sx,b.sy);items.push({d:b.sx+b.sy-1.5,f:()=>drawBuilding(g,x,y,b.s)})});
  hero.forEach(h=>{const [x,y]=grid.center(h.x,h.y);items.push({d:h.x+h.y+.5,f:()=>drawCharacter(g,x,y+8,{...h.sp,sc:h.sp.sc*1.2},{...DIRS[h.d],ring:'rgb(60,120,255)'})})});
  items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
}
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*cv.width/r.width,sy=(e.clientY-r.top)*cv.height/r.height;hover=grid.cellAt(sx,sy);info.textContent=hover?`kafel (${hover.x}, ${hover.y})  ${grid.isBlocked(hover.x,hover.y)?'zablokowany':'wolny'}  sąsiedzi: ${grid.neighbors(hover.x,hover.y).length}`:'poza planszą';draw()});
cv.addEventListener('click',()=>{if(hover){grid.toggle(hover.x,hover.y);draw()}});
draw();
window.__grid=grid;
</script></body></html>
