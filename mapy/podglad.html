<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Podgląd mapy v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0a0908;color:#f1e7d3;font:14px system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{position:fixed;right:8px;top:8px;display:flex;gap:6px;z-index:3}
#bar button,#bar a{min-height:40px;padding:0 12px;border:1px solid #5a4a34;background:rgba(42,35,24,.9);color:#f1e7d3;font:600 13px system-ui;display:flex;align-items:center;text-decoration:none}
#bar button.on{background:#a8481a;border-color:#ffb070}
#msg{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(18,15,12,.92);border:1px solid #3a3126;padding:6px 12px;z-index:3;max-width:80vw;text-align:center}
#mname{position:fixed;left:8px;top:8px;z-index:3;background:rgba(18,15,12,.85);border:1px solid #3a3126;padding:6px 12px;font:600 13px system-ui;letter-spacing:.04em}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
#err{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#5a1a14;border:1px solid #ff7050;padding:10px}
</style></head><body>
<canvas id="c"></canvas><div id="err"></div>
<div id="bar"><button id="bo" class="on">Osadzenie</button><button id="bg">Siatka</button><button id="bc">Kolizje</button><a id="ed" href="edytor.html">Edytor</a></div>
<div id="msg">Dotknij ziemi, by tam pójść.</div><div id="mname"></div><div id="fade"></div>
<script type="module">
import {createScene, loadAssets, spriteDefs} from './src/scena.js';
import {resolveExit} from './src/swiat.js';
addEventListener('error',e=>{const b=document.getElementById('err');b.style.display='block';b.textContent='Błąd: '+e.message+'. Strona wymaga serwera (npm start) albo adresu https, nie pliku z dysku.'});
const $=id=>document.getElementById(id),cv=$('c'),Q=new URLSearchParams(location.search);
const LIB=window.__LIB||await (await fetch('gra/biblioteka.json')).json(),SP=spriteDefs(LIB);
const url=p=>(window.__ASSETS&&window.__ASSETS[p])||('gra/'+p);
// świat: wszystkie mapy z index.json (albo wbudowane), przy ?draft=1 nadpisane wersjami roboczymi z edytora
const INDEX=window.__MAPS?{start:window.__INDEX||'pilot',maps:Object.keys(window.__MAPS)}:await (await fetch('maps/index.json')).json();
const maps={};for(const id of INDEX.maps)maps[id]=window.__MAPS?window.__MAPS[id]:await (await fetch('maps/'+id+'.json')).json();
if(Q.get('draft')==='1'){let extra=[];try{extra=JSON.parse(localStorage.getItem('arena.mapdraft.v3.__list'))||[]}catch(_){}
 for(const id of [...INDEX.maps,...extra]){try{const d=JSON.parse(localStorage.getItem('arena.mapdraft.v3.'+id));if(d&&d.objects)maps[id]=d}catch(_){}}}
let cur=Q.get('map')&&maps[Q.get('map')]?Q.get('map'):INDEX.start;
$('ed').href='edytor.html?map='+cur;
const A=await loadAssets(LIB,url);
let msgT=0;const toast=t=>{const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,2400)};
const label=()=>{$('mname').textContent=maps[cur].name||cur};
const sc=createScene(cv,LIB,A,maps[cur],{toast});label();
sc.resize();addEventListener('resize',()=>sc.resize());
let busy=false;
sc.onExit=async to=>{if(busy)return;busy=true;const r=resolveExit(maps,to,SP);
 if(r.error){toast(r.error);busy=false;return}
 $('fade').style.opacity=1;await new Promise(ok=>setTimeout(ok,260));
 cur=to.map;sc.enter(r.def,r.pos);label();$('ed').href='edytor.html?map='+cur;
 await new Promise(ok=>setTimeout(ok,60));$('fade').style.opacity=0;await new Promise(ok=>setTimeout(ok,260));busy=false};
cv.addEventListener('pointerdown',e=>{if(busy)return;const m=sc.toMap(e.clientX,e.clientY);sc.moveTo(m.cell[0],m.cell[1])});
const tg=(b,get,set)=>{$(b).onclick=()=>{set(!get());$(b).classList.toggle('on',get())}};
tg('bo',()=>sc.osad,v=>sc.osad=v);tg('bg',()=>sc.showGrid,v=>sc.showGrid=v);tg('bc',()=>sc.showCol,v=>sc.showCol=v);
addEventListener('keydown',e=>{if(e.key==='o')$('bo').click();if(e.key==='g')$('bg').click();if(e.key==='c')$('bc').click()});
window.__podglad={hero:sc.hero,get M(){return sc.M},get map(){return cur},view:()=>sc.view,go:(cx,cy)=>sc.moveTo(cx,cy),get busy(){return busy}};
const loop=t=>{requestAnimationFrame(loop);sc.draw(t)};requestAnimationFrame(loop);
</script></body></html>
